# Test-group matrix for ExponentialUtilities (consumed by the reusable
# SciML/.github grouped-tests.yml@v1 workflow via
# scripts/compute_affected_sublibraries.jl --root-matrix).
#
# Core runs the functional suite (basictests.jl) on every Julia version and OS.
# QA runs the metadata/static-analysis checks (Aqua + JET) in the isolated
# test/qa environment.
# GPU runs the CUDA tests in the isolated test/gpu environment on a self-hosted
# GPU runner (matching the pre-conversion GPU.yml workflow). It is `in_all = false`
# so it only ever runs under an explicit GROUP=GPU on the CUDA-equipped runner and
# is never pulled into the "All" aggregate (which a non-GPU job can fall back to),
# where `using CUDA` errors with "CUDA driver not functional".

[Core]
versions = ["lts", "1"]
os = ["ubuntu-latest", "macos-latest", "windows-latest", "macOS-15-intel"]

# "pre" (Julia 1.13-rc) is split out and non-blocking: the test env's
# DoubleFloats -> GenericLinearAlgebra fails to precompile with "Method
# overwriting is not permitted during Module precompilation". GenericLinearAlgebra
# guards its `LinearAlgebra.eigencopy_oftype(::UpperHessenberg, S)` override with
# `VERSION < v"1.14"`, but Julia 1.13 already split LinearAlgebra into its own
# standalone stdlib package that defines that same method, so the guard no
# longer prevents the clash. This is an upstream GenericLinearAlgebra/Julia
# incompatibility, not an ExponentialUtilities issue; drop this split once
# GenericLinearAlgebra ships a fix (JuliaLinearAlgebra/GenericLinearAlgebra.jl).
[Core-pre]
group = "Core"
versions = ["pre"]
os = ["ubuntu-latest", "macos-latest", "windows-latest", "macOS-15-intel"]
continue_on_error = true

[QA]
versions = ["lts", "1"]

[GPU]
versions = ["1"]
runner = ["self-hosted", "Linux", "X64", "gpu"]
timeout = 60
in_all = false
